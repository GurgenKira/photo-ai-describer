# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - photo-ai-describer

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: '18.x'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: npm install (backend)
        working-directory: ./backend
        run: npm ci

      # (Optional) if you later add tests/build scripts, they will work
      - name: run build/test if present (backend)
        working-directory: ./backend
        run: |
          npm run build --if-present
          npm run test --if-present

      # To keep artifact small, remove node_modules before uploading
      - name: Remove node_modules (backend)
        working-directory: ./backend
        run: rm -rf node_modules

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: ./backend

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
          path: ./backend

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_88943EAFDDC94950A214DED7DCA9C271 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_3B9693712D184A559D07E35CD00F170E }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_888B96E2C7E344FBA2FE84357F3050EA }}

      - name: 'Deploy to Azure Web App'
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'photo-ai-describer'
          slot-name: 'Production'
          package: ./backend          
